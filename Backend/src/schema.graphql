type Query {
  users: [User]
  getAllUsers: [User!]!
  profile: User
  questions: [Question]
  questionsPagination(limit: Int!, offset: Int!): QuestionPagination!
  question(id: ID!): Question
  answers(questionId: ID!): [Answer!]!
  searchQuestions(
    keyword: String
    authorId: ID
    fromDate: String
    toDate: String
  ): [Question]
  getNotifications(userId: ID!): [Notification!]!
}

type Mutation {
  registerUser(
    name: String! 
    email: String!
    password: String!
    avatar: String
  ): AuthPayload!

  loginUser(email: String!, password: String!): AuthPayload!

  createQuestion(title: String!, description: String!): Question

  upvoteQuestion(questionId: ID!): Question

  downvoteQuestion(questionId: ID!): Question

  addAnswer(questionId: ID!, text: String!): Answer!

  upvoteAnswer(answerId: ID!): Answer

  downvoteAnswer(answerId: ID!): Answer

  forgotPassword(email: String!): MessageResponse!

  resetPassword(token: String!, newPassword: String!): MessageResponse!

  updateUserRole(userId: ID!, role: String!): User

  deleteQuestion(id: ID!): Question

  changeUserRole(id: ID!, role: String!): MessageResponse

  deleteUser(id: ID!): MessageResponse

  markNotificationRead(id: ID!): Notification!

  createNotification(userId: ID!, message: String!): Notification!

}

type Subscription {
    newNotification(userId: ID!): Notification!
}
